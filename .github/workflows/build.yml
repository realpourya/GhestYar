
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          mkdir -p project
          unzip -q GhestYar-v2.5-rial-overdue-reminder.zip -d project

          echo "=== Searching for Gradle project ==="
          find project -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -print

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Enable AndroidX
        run: |
          set -e

          SETTINGS_FILE=$(find project -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          PROPERTIES_FILE="$PROJECT_DIR/gradle.properties"

          touch "$PROPERTIES_FILE"

          if grep -q '^[[:space:]]*android.useAndroidX[[:space:]]*=' "$PROPERTIES_FILE"; then
            sed -i 's/^[[:space:]]*android\.useAndroidX[[:space:]]*=.*/android.useAndroidX=true/' "$PROPERTIES_FILE"
          else
            echo 'android.useAndroidX=true' >> "$PROPERTIES_FILE"
          fi

          echo "AndroidX enabled in $PROPERTIES_FILE"
          cat "$PROPERTIES_FILE"

      - name: Build APK
        run: |
          set -e

          SETTINGS_FILE=$(find project -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -print -quit)

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Building project in: $PROJECT_DIR"

          gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GhestYar-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
