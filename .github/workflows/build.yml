
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          mkdir -p project
          unzip -q GhestYar-v2.5-attendance-home-card.zip -d project

          echo "=== Searching for Gradle project ==="
          find project -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -print

          echo "=== Searching for Android app ==="
          find project -type f \( \
            -path '*/app/build.gradle' \
            -o -path '*/app/build.gradle.kts' \
          \) -print

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          set -e

          SETTINGS_FILE=$(find project -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Gradle project directory: $PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory not found in $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 3 -type d -print
            exit 1
          fi

          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GhestYar-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
