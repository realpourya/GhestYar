name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select and extract current source (v3.0 or newer)
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(find . -maxdepth 1 -type f -name 'GhestYar-v*-source.zip' -print | sort -V)
          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "::error::No source archive found. Upload GhestYar-v3.0-source.zip to the repository root."
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[-1]}"
          VERSION="${ZIP_FILE#./GhestYar-v}"
          VERSION="${VERSION%-source.zip}"

          if [ "$(printf '%s\n' "3.0" "$VERSION" | sort -V | head -n1)" != "3.0" ]; then
            echo "::error::Only old source archives were found (latest: v$VERSION). Upload GhestYar-v3.0-source.zip before building. Refusing to build an older version."
            exit 1
          fi

          echo "Selected source archive: $ZIP_FILE (version $VERSION)"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          mapfile -t SETTINGS_FILES < <(find project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print)
          if [ "${#SETTINGS_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Gradle settings file; found ${#SETTINGS_FILES[@]}."
            printf '%s\n' "${SETTINGS_FILES[@]}"
            exit 1
          fi

          PROJECT_DIR="$(dirname "${SETTINGS_FILES[0]}")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Building project directory: $PROJECT_DIR"

      - name: Repair malformed newline in v3 Java source
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/src/main/java/com/pourya/ghestyar/MainActivity.java" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          # Replace an actual newline placed between Java string quotes
          # with the two-character Java escape sequence backslash+n.
          broken = '"' + chr(10) + '"'
          fixed = '"' + chr(92) + 'n' + '"'
          count = source.count(broken)

          if count:
              source = source.replace(broken, fixed)
              path.write_text(source, encoding="utf-8")
              print(f"SUCCESS: repaired {count} malformed Java string newline(s).")
          else:
              print("No quote-newline-quote sequence found; source left unchanged.")
          PY

      - name: Apply v3.1 calendar redesign and long-press editing
        shell: bash
        run: |
          set -euo pipefail
          python3 patches/v3.1/apply_patch.py "$PROJECT_DIR"
          echo "APP_VERSION=3.1" >> "$GITHUB_ENV"
          grep -n "versionCode 21; versionName '3.1'" "$PROJECT_DIR/app/build.gradle"

      - name: Apply v3.2 system theme and remove calendar legend
        shell: bash
        run: |
          set -euo pipefail
          python3 patches/v3.2/apply_patch.py "$PROJECT_DIR"
          echo "APP_VERSION=3.2" >> "$GITHUB_ENV"
          grep -n "versionCode 22; versionName '3.2'" "$PROJECT_DIR/app/build.gradle"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          mapfile -t APK_FILES < <(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print)
          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "::error::Build completed but no debug APK was found."
            exit 1
          fi
          printf 'Generated APK: %s\n' "${APK_FILES[@]}"

      - name: Package updated v3.2 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release"
          (cd "$PROJECT_DIR" && zip -qr "$GITHUB_WORKSPACE/release/GhestYar-v3.2-source.zip" . -x '**/build/**' '**/.gradle/**')

      - name: Upload updated source v3.2
        uses: actions/upload-artifact@v4
        with:
          name: GhestYar-v3.2-source
          path: release/GhestYar-v3.2-source.zip
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GhestYar-v${{ env.APP_VERSION }}-APK
          path: "${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
