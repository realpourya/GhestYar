name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract v2.8 project source
        run: |
          set -e
          ZIP_FILE="GhestYar-v2.8-source.zip"
          test -f "$ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project
          SETTINGS_FILE=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)
          test -n "$SETTINGS_FILE"
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          set -e
          gradle -p "$PROJECT_DIR" --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        run: |
          set -e
          APK_FILE=$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)
          test -n "$APK_FILE"
          echo "APK generated: $APK_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GhestYar-v2.8-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
